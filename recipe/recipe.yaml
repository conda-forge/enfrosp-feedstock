schema_version: 1

context:
  name: enfrosp
  version: "0.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/enfrosp-${{ version }}.tar.gz
  sha256: f035df2e34db39a0bb89fa1422963e6204878ecff3abb44b00790335dc2eb50d

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - enfrosp = enfrosp.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - gdal
    - geoarray
    - numpy
    - scipy

tests:
  - python:
      imports:
        - enfrosp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - enfrosp --help

about:
  summary: EnMAP Fast Retrieval Of Snow Properties
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://git.gfz-potsdam.de/EnMAP/GFZ_Tools_EnMAP_BOX/enfrosp

extra:
  recipe-maintainers:
    - danschef
